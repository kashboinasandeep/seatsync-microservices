# Application Name
spring.application.name=api-gateway

# Gateway Port
server.port=8080

# Eureka Server Connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Register Gateway with Eureka
eureka.client.register-with-eureka=true

# Fetch Service Registry
eureka.client.fetch-registry=true

# Use IP address
eureka.instance.prefer-ip-address=true

# User Service Route
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# User Authentication Route
spring.cloud.gateway.server.webflux.routes[1].id=user-auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**